

# Profile for the deployed demo server (the course allows H2 for the deployed version).
# Data is kept in memory and the demo data is recreated on every start.
spring.datasource.url=jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2 web console at /h2-console (JDBC URL jdbc:h2:mem:stockdb, user sa, empty password), admins only
spring.h2.console.enabled=true
