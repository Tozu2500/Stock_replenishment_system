<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: page(~{::main})}">
<main>
    <h1>Purchase order <span th:text="${order.orderNumber}"></span> <span th:class="${order.status}" th:text="${order.status}"></span></h1>
    <div class="actions" sec:authorize="hasRole('ADMIN')">
        <!-- One button for every status the order may move to next -->
        <form th:each="next : ${order.status.nextStatuses}" method="post"
              th:action="@{/purchase-orders/{id}/status(id=${order.id}, status=${next})}">
            <button class="btn btn-primary" th:text="'Set ' + ${next}"></button></form>
        <form th:if="${order.status.deletable}" th:action="@{/purchase-orders/{id}/delete(id=${order.id})}" method="post">
            <button class="btn btn-danger" onclick="return confirm('Delete permanently?')">Delete</button></form>
    </div>
    <div class="grid-2">
        <dl class="card">
            <dt>Supplier</dt><dd th:text="${order.supplier.name}"></dd>
            <dt>Order date</dt><dd th:text="${order.orderDate}"></dd>
            <dt>Expected delivery</dt><dd th:text="${order.expectedDeliveryDate}"></dd>
        </dl>
        <form class="card form" sec:authorize="hasRole('ADMIN')" th:if="${order.status.editable}" th:object="${line}"
              th:action="@{/purchase-orders/{id}/items(id=${order.id})}" method="post" novalidate>
            <h2>Add item</h2>
            <label>Product (only products this supplier supplies)
                <select th:field="*{productId}">
                    <option value="">Choose...</option>
                    <option th:each="p : ${order.supplier.products}" th:value="${p.id}" th:text="${p.name}"></option>
                </select></label> <span th:errors="*{productId}"></span>
            <label>Quantity <input th:field="*{quantity}"></label> <span th:errors="*{quantity}"></span>
            <label>Unit price (empty = list price) <input th:field="*{unitPrice}"></label> <span th:errors="*{unitPrice}"></span>
            <button type="submit" class="btn btn-primary">Add item</button>
        </form>
    </div>
    <table class="card">
        <tr><th>Product</th><th class="num">Quantity</th><th class="num">Unit price</th><th class="num">Total</th></tr>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.product.name}"></td>
            <td class="num" th:text="${item.quantity}"></td>
            <td class="num" th:text="${item.unitPrice} + ' €'"></td>
            <td class="num" th:text="${item.lineTotal} + ' €'"></td>
        </tr>
        <tr><th colspan="3">Total</th><th class="num" th:text="${order.total} + ' €'"></th></tr>
    </table>
</main>
</html>
