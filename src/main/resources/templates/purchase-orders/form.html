<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}">
<main>
    <h1>New purchase order</h1>
    <form class="card form" th:action="@{/purchase-orders}" th:object="${order}" method="post" novalidate>
        <label>Supplier (active suppliers only)
            <select th:field="*{supplierId}">
                <option value="">Choose...</option>
                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
            </select></label> <span th:errors="*{supplierId}"></span>
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
</main>
</html>
