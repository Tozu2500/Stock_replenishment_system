spring.application.name=stock-replenishment-system
server.port=${PORT:8473}

# Optional local file for secrets such as DB_PASSWORD=... (listed in .gitignore, never committed)
spring.config.import=optional:file:.env[.properties]

# External MySQL database. Override with the environment variables DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_replenishment?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# Thymeleaf pages read lazy relationships (e.g. category.products) while the page is rendered
spring.jpa.open-in-view=true

# Show the reason of an error (e.g. "Product with id 99 was not found") on the error page
spring.web.error.include-message=always

# Validation messages in English regardless of the browser language
spring.web.locale=en
spring.web.locale-resolver=fixed

# Demo data is inserted into an empty database on startup
app.seed.enabled=true
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-password=${USER_PASSWORD:user123}
